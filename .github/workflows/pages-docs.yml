name: Deploy docs.hara-lang.org

on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "netlify-docs-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Hara UI assets
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-ui
          path: vendor/hara-ui

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Download and verify pinned Studio runtime
        run: scripts/install-runtime

      - name: Reject stale project guidance
        run: node scripts/check-content.mjs

      - name: Validate interactive syllabi
        run: node scripts/check-syllabi.mjs

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Deploy main to docs.testing.hara-lang.org
        if: github.ref_name == 'main'
        run: npx --yes netlify-cli deploy --prod --dir site --message "main ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}

      - name: Deploy production to docs.hara-lang.org
        if: github.ref_name == 'production'
        run: npx --yes netlify-cli deploy --prod --dir site --message "production ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
