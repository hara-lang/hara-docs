name: Validate Hara docs

on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs-validation-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Download and verify pinned Studio runtime
        run: scripts/install-runtime

      - name: Reject stale project guidance
        run: node scripts/check-content.mjs

      - name: Validate interactive syllabi
        run: node scripts/check-syllabi.mjs

      - name: Validate InstaREPL integration
        run: |
          node --check docs/javascripts/instarepl.js
          node scripts/check-instarepl.mjs

      - name: Validate shared live-card integration
        run: |
          node --check docs/javascripts/home-live.js
          test -f vendor/hara-ui/packages/live/src/live-card.js
          test -f vendor/hara-ui/packages/live/src/style.css

      - name: Build MkDocs compatibility site
        run: mkdocs build --strict

      # Canonical publication is owned by hara-lang/hara and is built below
      # https://www.hara-lang.org/docs/ from this repository's pinned submodule.
