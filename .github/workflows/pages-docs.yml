name: Publish Hara docs

on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "hara-docs-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build standalone site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Download and verify pinned Studio runtime
        run: scripts/install-runtime

      - name: Reject stale project guidance
        run: node scripts/check-content.mjs

      - name: Validate shared navigation and redirects
        run: node scripts/check-manifest.mjs

      - name: Validate lesson components
        run: |
          node --check docs/javascripts/syllabus.js
          node --test docs/javascripts/syllabus.test.mjs
          node scripts/check-lessons.mjs
          node scripts/check-little-book.mjs

      - name: Validate HAL intro live examples
        run: node scripts/check-hal-intro-live.mjs

      - name: Validate InstaREPL integration
        run: |
          node --check docs/javascripts/instarepl.js
          node scripts/check-instarepl.mjs

      - name: Validate shared live-card integration
        run: |
          node --check docs/javascripts/home-live.js
          test -f vendor/hara-ui/packages/live/src/live-card.js
          test -f vendor/hara-ui/packages/live/src/style.css

      - name: Validate shared popup Identity integration
        run: |
          node --check docs/javascripts/identity-loader.js
          grep -F '<meta name="hara-identity-mode" content="popup">' overrides/main.html
          grep -F '<div data-hara-identity></div>' overrides/main.html
          grep -F '/v1/identity-client.js' docs/javascripts/identity-loader.js
          ! grep -E 'client_secret|access_token|HARA_GITHUB_OAUTH_CLIENT_SECRET' docs/javascripts/identity-loader.js

      - name: Verify independent deployment credential
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "NETLIFY_AUTH_TOKEN is required for independent documentation publication." >&2
            exit 1
          fi

      - name: Build standalone docs site
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs build --clean

      - name: Verify standalone publication artifact
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/books/the-little-book-of-hal/docs/index.html
          test -s site/books/the-little-book-of-hal/docs/10-the-value-of-a-form/index.html
          test -s site/javascripts/syllabus.js
          test -s site/javascripts/identity-loader.js
          test -s site/rust/hara.wasm
          test -s site/vendor/hara-ui/packages/live/src/live-card.js
          test ! -e site/CNAME
          grep -Fq 'https://hara-docs.netlify.app/' site/index.html
          grep -Fq 'The Little Book of HAL' site/books/the-little-book-of-hal/docs/index.html
          grep -Fq '<meta name="hara-identity-mode" content="popup">' site/index.html
          grep -Fq 'data-hara-identity' site/index.html

      - name: Preserve production site artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hara-docs-site
          path: site
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy independent Hara docs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: netlify-production
      url: https://hara-docs.netlify.app/
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ebf43b71-ef29-44d0-a951-8217f3e2471b
      DOCS_ORIGIN: https://hara-docs.netlify.app
    steps:
      - name: Download validated site
        uses: actions/download-artifact@v4
        with:
          name: hara-docs-site
          path: site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy validated artifact to Netlify
        run: >-
          npx --yes netlify-cli@latest deploy
          --prod
          --dir site
          --site "$NETLIFY_SITE_ID"
          --message "hara-docs ${GITHUB_SHA}"

      - name: Verify published Little Book and browser runtime
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --location --silent --show-error \
              "$DOCS_ORIGIN/books/the-little-book-of-hal/docs/" \
              --output /tmp/little-book.html \
              && grep -Fq 'The Little Book of HAL' /tmp/little-book.html \
              && curl --fail --location --silent --show-error \
                "$DOCS_ORIGIN/rust/hara.wasm" \
                --output /tmp/hara.wasm \
              && test -s /tmp/hara.wasm; then
              echo "verified $DOCS_ORIGIN/books/the-little-book-of-hal/docs/"
              exit 0
            fi
            sleep 5
          done
          echo "Netlify deployed, but the independent documentation origin did not pass its smoke check." >&2
          exit 1
