name: Foundation API documentation

on:
  pull_request:
    paths:
      - "foundation-api-target.json"
      - "scripts/generate-api.mjs"
      - "scripts/generate-api.test.mjs"
      - "docs/api/**"
      - "docs/guides/foundation-reorganization-2026.md"
      - "docs/hal-intro/07-io-and-files.md"
      - "generated/api-index.json"
      - "generated/foundation-api-gaps.json"
      - ".github/workflows/foundation-api-docs.yml"
  push:
    branches: [main]
    paths:
      - "foundation-api-target.json"
      - "scripts/generate-api.mjs"
      - "scripts/generate-api.test.mjs"
      - "docs/api/**"
      - "docs/guides/foundation-reorganization-2026.md"
      - "docs/hal-intro/07-io-and-files.md"
      - "generated/api-index.json"
      - "generated/foundation-api-gaps.json"
      - ".github/workflows/foundation-api-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Read pinned Hara and specification targets
        id: target
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path, PurePosixPath

          target = json.loads(Path("foundation-api-target.json").read_text())
          repository = target["repository"]
          commit = target["commit"]
          schema = target["manifestSchemaVersion"]
          authority = target["authority"]
          gap_ledger = target["gapLedger"]
          if repository != "hara-lang/hara":
              raise SystemExit(f"unsupported Foundation API repository: {repository}")
          if len(commit) != 40 or any(ch not in "0123456789abcdef" for ch in commit):
              raise SystemExit(f"Foundation API target is not an immutable commit: {commit}")
          if schema != 2:
              raise SystemExit(f"unsupported Foundation API manifest schema: {schema}")
          if authority["repository"] != "hara-lang/hara-specs-registry":
              raise SystemExit(f"unsupported Foundation authority repository: {authority['repository']}")
          registry_commit = authority["commit"]
          if len(registry_commit) != 40 or any(ch not in "0123456789abcdef" for ch in registry_commit):
              raise SystemExit(f"Foundation authority is not an immutable commit: {registry_commit}")
          gap_path = PurePosixPath(gap_ledger)
          if gap_path.is_absolute() or ".." in gap_path.parts:
              raise SystemExit(f"unsafe Foundation API gap ledger path: {gap_ledger}")
          print(f"repository={repository}")
          print(f"commit={commit}")
          print(f"registry_repository={authority['repository']}")
          print(f"registry_commit={registry_commit}")
          print(f"gap_ledger={gap_ledger}")
          PY

      - name: Checkout pinned Hara source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ steps.target.outputs.commit }}
          path: .hara-api-source

      - name: Checkout pinned Foundation specification authority
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.target.outputs.registry_repository }}
          ref: ${{ steps.target.outputs.registry_commit }}
          path: .hara-specs-source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Hara Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .hara-api-source/core/rust

      - name: Generate pinned schema-v2 manifest reproducibly
        run: |
          python .hara-api-source/scripts/generate_foundation_api_manifest.py \
            --root .hara-api-source \
            --repository https://github.com/${{ steps.target.outputs.repository }} \
            --ref ${{ steps.target.outputs.commit }} \
            --commit ${{ steps.target.outputs.commit }} \
            --output generated/foundation-api-manifest.json
          cp generated/foundation-api-manifest.json "$RUNNER_TEMP/foundation-api-manifest-first.json"
          python .hara-api-source/scripts/generate_foundation_api_manifest.py \
            --root .hara-api-source \
            --repository https://github.com/${{ steps.target.outputs.repository }} \
            --ref ${{ steps.target.outputs.commit }} \
            --commit ${{ steps.target.outputs.commit }} \
            --output generated/foundation-api-manifest.json
          cmp "$RUNNER_TEMP/foundation-api-manifest-first.json" generated/foundation-api-manifest.json

      - name: Test the documentation generator
        run: |
          node --check scripts/generate-api.mjs
          node --check scripts/generate-api.test.mjs
          node --test scripts/generate-api.test.mjs

      - name: Generate current API and migration pages reproducibly
        run: |
          node scripts/generate-api.mjs \
            --input generated/foundation-api-manifest.json
          git diff -- docs/api generated/api-index.json > "$RUNNER_TEMP/foundation-api-docs-first.diff"
          node scripts/generate-api.mjs \
            --input generated/foundation-api-manifest.json
          git diff -- docs/api generated/api-index.json > "$RUNNER_TEMP/foundation-api-docs-second.diff"
          cmp "$RUNNER_TEMP/foundation-api-docs-first.diff" "$RUNNER_TEMP/foundation-api-docs-second.diff"
          git status --short -- docs/api generated/api-index.json

      - name: Validate generated provenance, authority, gaps, and boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path, PurePosixPath

          manifest = json.loads(Path("generated/api-index.json").read_text())
          target = json.loads(Path("foundation-api-target.json").read_text())
          gaps = json.loads(Path(target["gapLedger"]).read_text())
          expected = [
              "std.foundation",
              "std.foundation.bytes",
              "std.foundation.coroutine",
              "std.foundation.pretty",
              "std.foundation.promise",
              "std.foundation.string",
          ]
          current = [
              item["name"]
              for item in manifest["namespaces"]
              if item.get("group") == "foundation"
          ]
          assert manifest["schemaVersion"] == target["manifestSchemaVersion"] == 2
          assert manifest["source"]["commit"] == target["commit"]
          assert current == expected, {"expected": expected, "actual": current}
          assert manifest["surfaceDigest"].startswith("sha256:")
          assert len(manifest.get("migrations", [])) == 11
          native = {item["name"] for item in manifest.get("nativeObjects", [])}
          assert {"Edn", "Json", "Crypto", "File", "Socket", "Host", "Kernel"}.issubset(native)
          assert "Process" not in native
          for field in (
              manifest["inventory"]["path"],
              manifest["migrationLedger"]["path"],
          ):
              value = PurePosixPath(field)
              assert not value.is_absolute(), field
              assert ".." not in value.parts, field

          authority = target["authority"]
          assert gaps["schemaVersion"] == 1
          assert gaps["core"]["repository"] == target["repository"]
          assert gaps["core"]["commit"] == target["commit"]
          assert gaps["registry"]["repository"] == authority["repository"]
          assert gaps["registry"]["commit"] == authority["commit"]
          assert gaps["registry"]["foundation"] == authority["foundation"]
          assert gaps["registry"]["foundationAnnex"] == authority["foundationAnnex"]
          assert Path(".hara-specs-source", authority["foundation"]).is_dir()
          assert Path(".hara-specs-source", authority["foundationAnnex"]).is_dir()
          tracking = {gap["tracking"] for gap in gaps["gaps"]}
          assert "https://github.com/hara-lang/hara/issues/844" in tracking
          assert "https://github.com/hara-lang/hara/issues/649" in tracking
          for gap in gaps["gaps"]:
              assert gap["id"] and gap["status"] and gap["scope"]
              assert gap["currentBehavior"] and gap["requiredClosure"]
          PY

      - name: Commit generated API and migration pages
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- docs/api generated/api-index.json; then
            echo "Generated Foundation API documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/api generated/api-index.json
          git commit -m "Regenerate Foundation API documentation from pinned Hara manifest"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Reject generated drift outside same-repository pull requests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          git diff --exit-code -- docs/api generated/api-index.json

      - name: Upload generated API review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-api-docs-generated
          path: |
            docs/api
            generated/api-index.json
            generated/foundation-api-manifest.json
            generated/foundation-api-gaps.json
          if-no-files-found: error
          retention-days: 30
