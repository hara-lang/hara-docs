name: Publish persistent named-value documentation

on:
  push:
    branches:
      - agent/document-persistent-named-values
    paths:
      - .github/workflows/agent-publish-persistent-named-values.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/document-persistent-named-values
          fetch-depth: 0

      - name: Update the named-value reference
        run: python3 .github/agent/publish_named_value_reference.py

      - name: Validate the documentation
        run: |
          git diff --check
          node scripts/check-content.mjs
          node scripts/check-manifest.mjs
          grep -Fq '### 7.3 Immutable and mutable named values' docs/reference/l0-language.md
          grep -Fq '(set! (field cursor :x) 10)' docs/reference/l0-language.md
          grep -Fq 'not HTA-serializable or session-transferable' docs/reference/l0-language.md

      - name: Publish the clean branch
        run: |
          git rm .github/workflows/agent-publish-persistent-named-values.yml
          git rm .github/agent/publish_named_value_reference.py
          git rm .github/agent/publish_persistent_named_values.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reference/l0-language.md
          git commit -m 'Document persistent structs and mutable named values'
          git push origin HEAD:refs/heads/agent/document-persistent-named-values
