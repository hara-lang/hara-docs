site_name: Hara
site_description: A small, high-performance Lisp for learning to build software from first principles.
site_url: https://www.hara-lang.org/docs/
docs_dir: docs
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  favicon: assets/favicon-48.svg?v=2
  logo: assets/logo-white.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: slate
      primary: black
      accent: cyan
extra_css:
  - vendor/hara-ui/tokens.css
  - vendor/hara-ui/components.css
  - stylesheets/hara.css?v=31
  - stylesheets/syllabus.css?v=1
extra_javascript:
  - javascripts/hara.js
  - javascripts/demo.js
  - javascripts/home-live.js
  - javascripts/live-examples.js
  - javascripts/syllabus.js
  - javascripts/live-canvas.js
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      # Markdown authors use the Hara language name. The current syntax is
      # compatible with Pygments' Clojure lexer; retain language-hara in the
      # rendered markup so a dedicated lexer can replace this alias later.
      pygments_lang_class: true
      extend_pygments_lang:
        - name: hara
          lang: clojure
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji
  - toc:
      permalink: true
plugins:
  - search
  - monorepo
  - redirects:
      redirect_maps:
        hara-lisp-intro/index.md: hal-intro/index.md
        hara-lisp-intro/01-basic-data.md: hal-intro/01-basic-data.md
        hara-lisp-intro/02-functions-and-atoms.md: hal-intro/02-functions-and-atoms.md
        hara-lisp-intro/03-iterators-and-streaming.md: hal-intro/03-iterators-and-streaming.md
        hara-lisp-intro/04-coroutines-and-promises.md: hal-intro/04-coroutines-and-promises.md
        hara-lisp-intro/05-array-and-object.md: hal-intro/05-array-and-object.md
        hara-lisp-intro/06-bytes-and-strings.md: hal-intro/06-bytes-and-strings.md
        hara-lisp-intro/07-io-and-files.md: hal-intro/07-io-and-files.md
hooks:
  - scripts/copy-hara-ui.py
