site_name: Hara
site_description: A small, high-performance Lisp for learning to build software from first principles.
site_url: https://hara-lang.org/docs/
docs_dir: docs
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  favicon: assets/favicon-48.svg?v=2
  logo: assets/logo-white.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: slate
      primary: black
      accent: cyan
extra_css:
  - vendor/hara-ui/tokens.css
  - vendor/hara-ui/components.css
  - stylesheets/hara.css?v=31
  - stylesheets/syllabus.css?v=2
extra_javascript:
  - javascripts/hara.js
  - javascripts/demo.js
  - javascripts/home-live.js
  - javascripts/live-examples.js
  - javascripts/instarepl.js
  - javascripts/syllabus.js
  - javascripts/live-canvas.js
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      # Markdown authors use the Hara language name. The current syntax is
      # compatible with Pygments' Clojure lexer; retain language-hara in the
      # rendered markup so a dedicated lexer can replace this alias later.
      pygments_lang_class: true
      extend_pygments_lang:
        - name: hara
          lang: clojure
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji
  - toc:
      permalink: true
plugins:
  - search
  - monorepo
  - redirects:
      redirect_maps: {}
hooks:
  - scripts/docs_manifest.py
  - scripts/copy-hara-ui.py
