site_name: Hara
site_description: A live, visual programming environment for Hara projects.
site_url: https://docs.hara-lang.org/
docs_dir: docs
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  favicon: assets/favicon-48.svg?v=2
  logo: assets/logo-white.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: slate
      primary: black
      accent: cyan
extra_css:
  - vendor/hara-ui/tokens.css
  - vendor/hara-ui/components.css
  - stylesheets/hara.css?v=29
extra_javascript:
  - javascripts/hara.js
  - javascripts/demo.js
  - javascripts/home-live.js
  - javascripts/live-examples.js
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      # Markdown authors use the Hara language name. The current syntax is
      # compatible with Pygments' Clojure lexer; retain language-hara in the
      # rendered markup so a dedicated lexer can replace this alias later.
      pygments_lang_class: true
      extend_pygments_lang:
        - name: hara
          lang: clojure
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji
  - toc:
      permalink: true
plugins:
  - search
  - monorepo
hooks:
  - scripts/copy-hara-ui.py
nav:
  - Start:
      - "01 — Why Hara": start/orientation.md
      - "02 — Small, Fast, Web Native": getting-started.md
      - "03 — Hara for Clojurists": start/clojure.md
      - "04 — Hara for Web Devs": start/web-developers.md
      - Your first browser game: create/first-game.md
  - Learn Hara:
      - Introductory:
          - Language guide: user-guide.md
      - Systems and Wasm:
          - Namespaces, libraries, and tests: namespaces.md
          - Namespace project walkthrough: walkthroughs/service-project.md
          - Rust and WASM runtime: reference/rust-runtime.md
      - HTA and Substrate:
          - Hara kernel: kernel.md
          - Substrate application architecture: start/react.md
      - The little book of Hara:
          - Learn to program: learn-programming/index.md
  - Build projects:
      - Projects and visual workspaces: projects/index.md
      - Hara Chrome project: create/chrome-project.md
      - Hara VS Code project: create/vscode-project.md
  - Reference:
      - Reference map: reference/index.md
      - Language:
          - L0 language contract: reference/l0-language.md
          - Builtins: builtins.md
          - Runtime libraries: reference/runtime-libraries.md
          - Namespace catalog: reference/namespaces.md
      - Runtime and tools:
          - REPL UX: reference/repl.md
          - Substrate application architecture: start/react.md
          - RESP protocol: reference/resp-protocol.md
          - Native runtime flavors: reference/native-flavors.md
          - Rust and WASM runtime: reference/rust-runtime.md
      - Extension system: reference/extensions-contract.md
      - Development and APIs:
          - Developer guide: development.md
          - Development tracing: development-tracing.md
          - Java and Rust APIs: javadocs.md
      - Implementation notes:
          - Xtalk equivalence: reference/xtalk-equivalence.md
          - Clojure core compatibility: reference/clojure-core-compatibility.md
          - Runtime benchmarks: reference/runtime-benchmarks.md
          - Foundation porting: foundation-porting.md
