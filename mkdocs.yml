site_name: Hara
site_description: A live, visual programming environment for Hara projects.
site_url: https://docs.hara-lang.org/
docs_dir: docs
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  favicon: assets/hara-favicon.svg
  logo: assets/hara-mark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: slate
      primary: black
      accent: cyan
extra_css:
  - vendor/hara-ui/tokens.css
  - vendor/hara-ui/components.css
  - stylesheets/hara.css
extra_javascript:
  - javascripts/hara.js
  - javascripts/demo.js
  - javascripts/console.js
  - javascripts/page-host.js
  - javascripts/home-live.js
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      # Markdown authors use the Hara language name. The current syntax is
      # compatible with Pygments' Clojure lexer; retain language-hara in the
      # rendered markup so a dedicated lexer can replace this alias later.
      pygments_lang_class: true
      extend_pygments_lang:
        - name: hara
          lang: clojure
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji
  - toc:
      permalink: true
plugins:
  - search
  - monorepo
nav:
  - Create:
      - Start with Hara: index.md
      - Choose your workspace: getting-started.md
      - Your first browser game: create/first-game.md
      - Hara Chrome project: create/chrome-project.md
      - Hara VS Code project: create/vscode-project.md
  - Learn to program:
      - Start programming: learn-programming/index.md
      - Values and data: learn-programming/values-and-data.md
      - Decisions and repetition: learn-programming/decisions-and-repetition.md
      - Functions and changing state: learn-programming/functions-and-state.md
  - Work visually:
      - Studio: studio.md
      - Workspace model: work-visually.md
  - Projects & sharing:
      - Project structure: projects/index.md
      - Publish to Greenways Spaces: projects/publish-greenways.md
  - Learn the language:
      - Overview: learn.md
      - User guide: user-guide.md
      - Namespaces and modules: namespaces.md
      - Walkthroughs:
          - Namespace project: walkthroughs/service-project.md
          - Library namespaces: walkthroughs/libraries.md
          - Testing namespaces: walkthroughs/testing.md
  - Build & integrate:
      - Kernel and REPL: kernel.md
      - Rust and WASM runtime: reference/rust-runtime.md
      - Java API: javadocs.md
      - Developer guide: development.md
  - Reference & specifications:
      - Overview: reference/index.md
      - L0 language: reference/l0-language.md
      - Builtins: builtins.md
      - Namespace catalog: reference/namespaces.md
      - Runtime libraries: reference/runtime-libraries.md
      - Extensions: reference/extensions-contract.md
      - Extension overview: reference/extensions.md
      - REPL UX: reference/repl.md
      - RESP protocol: reference/resp-protocol.md
      - Native flavors: reference/native-flavors.md
      - JVM flavor: reference/jvm-flavor.md
      - Xtalk equivalence: reference/xtalk-equivalence.md
      - Clojure core compatibility: reference/clojure-core-compatibility.md
      - Runtime benchmarks: reference/runtime-benchmarks.md
      - Foundation porting: foundation-porting.md
